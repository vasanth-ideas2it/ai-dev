<div class="page-header">
  <h2>Deals</h2>

  <span class="spacer"></span>

  @if (pipelines.length > 1) {
    <mat-form-field appearance="outline" class="pipeline-select">
      <mat-label>Pipeline</mat-label>
      <mat-select [(ngModel)]="selectedPipeline" (ngModelChange)="onPipelineChange($event)">
        @for (p of pipelines; track p.id) {
          <mat-option [value]="p">{{ p.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }

  <mat-button-toggle-group [(ngModel)]="viewMode" class="view-toggle">
    <mat-button-toggle value="kanban">
      <mat-icon>view_kanban</mat-icon>
    </mat-button-toggle>
    <mat-button-toggle value="list">
      <mat-icon>view_list</mat-icon>
    </mat-button-toggle>
  </mat-button-toggle-group>

  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon> New Deal
  </button>
</div>

@if (pipelinesLoading$ | async) {
  <div class="loading-center"><mat-spinner diameter="40" /></div>
}

@if (selectedPipeline) {
  @if (viewMode === 'kanban') {
    <app-kanban-board
      [pipelineId]="selectedPipeline.id"
      [pipeline]="selectedPipeline" />
  } @else {
    <app-deal-list [pipelineId]="selectedPipeline.id" />
  }
}
