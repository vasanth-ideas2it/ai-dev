<div class="list-toolbar">
  <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
    <mat-label>Search contacts</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Name, email…">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <span class="spacer"></span>

  <button mat-stroked-button (click)="openImport()" matTooltip="Import from CSV">
    <mat-icon>upload</mat-icon> Import
  </button>
  <button mat-raised-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon> Add Contact
  </button>
</div>

<mat-card class="table-card">
  @if (loading$ | async) {
    <mat-progress-bar mode="indeterminate" />
  }

  <table mat-table [dataSource]="(contacts$ | async) ?? []"
         matSort (matSortChange)="onSort($event)"
         class="contacts-table">

    <!-- Avatar column -->
    <ng-container matColumnDef="avatar">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <div class="avatar">{{ initials(row) }}</div>
      </td>
    </ng-container>

    <!-- Name column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="firstName">Name</th>
      <td mat-cell *matCellDef="let row">
        <div class="name-cell">
          <strong>{{ row.firstName }} {{ row.lastName }}</strong>
          @if (row.label) {
            <span class="label-chip">{{ row.label }}</span>
          }
        </div>
      </td>
    </ng-container>

    <!-- Email column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="email">Email</th>
      <td mat-cell *matCellDef="let row">
        <a [href]="'mailto:' + row.email" (click)="$event.stopPropagation()" class="link">
          {{ row.email }}
        </a>
      </td>
    </ng-container>

    <!-- Phone column -->
    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let row">{{ row.phone }}</td>
    </ng-container>

    <!-- Company column -->
    <ng-container matColumnDef="company">
      <th mat-header-cell *matHeaderCellDef>Company</th>
      <td mat-cell *matCellDef="let row">{{ row.companyName }}</td>
    </ng-container>

    <!-- Owner column -->
    <ng-container matColumnDef="owner">
      <th mat-header-cell *matHeaderCellDef>Owner</th>
      <td mat-cell *matCellDef="let row">{{ row.ownerName }}</td>
    </ng-container>

    <!-- Actions column -->
    <ng-container matColumnDef="actions" stickyEnd>
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row" class="actions-cell">
        <button mat-icon-button matTooltip="Edit"
                (click)="openEdit($event, row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Delete" color="warn"
                (click)="openDelete($event, row)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"
        class="clickable-row"
        (click)="onRowClick(row)"></tr>

    <tr class="mat-mdc-no-data-row" *matNoDataRow>
      <td [attr.colspan]="displayedColumns.length" class="no-data">
        <mat-icon>person_search</mat-icon>
        <p>No contacts found.</p>
      </td>
    </tr>
  </table>

  <mat-paginator
    [length]="(pagination$ | async)?.total ?? 0"
    [pageSize]="20"
    [pageSizeOptions]="[10, 20, 50]"
    showFirstLastButtons
    (page)="onPage($event)">
  </mat-paginator>
</mat-card>
