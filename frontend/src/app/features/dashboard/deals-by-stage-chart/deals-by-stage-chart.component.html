<mat-card class="chart-card">
  <mat-card-header>
    <mat-card-title>Deals by Stage</mat-card-title>
  </mat-card-header>
  <mat-card-content class="chart-content">
    @if (loading) {
      <div class="loading-center"><mat-spinner diameter="36" /></div>
    } @else if (stages.length === 0) {
      <div class="empty-state">No deal data available</div>
    } @else {
      <div class="chart-wrap">
        <canvas baseChart
                [data]="chartData"
                [options]="chartOptions"
                type="bar">
        </canvas>
      </div>
    }
  </mat-card-content>
</mat-card>
